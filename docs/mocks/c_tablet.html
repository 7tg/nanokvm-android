<html><head><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Roboto",system-ui,sans-serif;background:#0b0d10;color:#e8eaed;width:412px;height:915px;overflow:hidden;position:relative}
.sb{height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;color:#cfd3d8}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;background:#1a1f26;color:#b8c0c8}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}

body{width:1280px;height:800px;background:#0b0d10}
.l{position:absolute;left:0;top:0;bottom:0;width:340px;padding:28px;border-right:1px solid #1d232b}
.r{position:absolute;left:340px;right:0;top:0;bottom:0;padding:28px}
.screen{width:100%;height:600px;border-radius:16px;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#6b747d;border:1px solid #222}
.bar{display:flex;gap:10px;margin-top:16px}
.bar div{background:#151a20;border-radius:12px;padding:12px 16px;font-size:14px}
.state{display:flex;align-items:center;gap:14px;margin-top:26px;background:#13261b;border-radius:20px;padding:18px}
.b{background:#151a20;border-radius:16px;padding:16px;margin-top:12px;font-size:16px;display:flex;justify-content:space-between}
.b span{color:#8a939c;font-size:13px}
</style></head><body>
