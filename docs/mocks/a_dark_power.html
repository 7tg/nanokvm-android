<html><head><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Roboto",system-ui,sans-serif;background:#0b0d10;color:#e8eaed;width:412px;height:915px;overflow:hidden;position:relative}
.sb{height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;color:#cfd3d8}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;background:#1a1f26;color:#b8c0c8}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}

.wrap{padding:8px 24px}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
h1{font-size:22px;font-weight:600}
.sub{color:#8a939c;font-size:14px;margin-top:4px}
.ring{margin:56px auto 0;width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle,#13261b 0%,#0b0d10 70%);box-shadow:0 0 0 3px #3ddc8455,0 0 60px #3ddc8433}
.btn{width:150px;height:150px;border-radius:50%;background:#16301f;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #3ddc84}
.state{text-align:center;margin-top:26px;font-size:30px;font-weight:700;color:#3ddc84;letter-spacing:2px}
.hint{text-align:center;color:#8a939c;font-size:13px;margin-top:6px}
.row{display:flex;gap:12px;margin-top:40px}
.sec{flex:1;background:#151a20;border-radius:18px;padding:16px;font-size:15px;text-align:center}
.sec small{display:block;color:#8a939c;font-size:12px;margin-top:4px}
.warn{color:#ff8a80}
.kvm{margin-top:16px;background:#151a20;border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center}
.thumb{width:110px;height:62px;border-radius:10px;background:repeating-linear-gradient(45deg,#1d232b 0 8px,#181d23 8px 16px);display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b747d}
</style></head><body><div class="sb"><span>10:24</span><span>▾ ▴ 87%</span></div><div class="wrap">
